name: Monitoramento de Disponibilidade (Health Check UP/DOWN)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  health_check_producao:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar Status HTTP 200 (EcoGestao Movel Producao)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://emersonlimafranc-collab.github.io/ecogestao-movel-mvp/)
          echo "HTTP Status retornado pelo servidor: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "ALERTA CRITICO: Aplicacao fora do ar (Status DOWN)!"
            exit 1
          fi
          echo "STATUS UP: Aplicacao online e integra em producao!"
